<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>みおいっち</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Rounded Mplus 1c','Hiragino Maru Gothic Pro','Yu Gothic UI',sans-serif}
:root{
  --bg:#EDE5F4;--panel:#D8CCE8;--accent:#B8A0D8;--accent2:#A080C0;
  --btn:#C4A8E0;--btn-hover:#B490D4;--text:#5A4070;--text-light:#8868A8;
  --white:#FBF8FF;--bar-hunger:#F0A8B8;--bar-love:#F0C0D8;
  --bar-health:#A8D8C0;--bar-sleep:#A8C0E8;
  --floor:#E0D4F0;--wall:#F0E8F8;--shadow:rgba(90,64,112,0.12);
}
body{background:var(--bg);display:flex;flex-direction:column}

/* TOP BAR */
#topBar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:2px solid var(--accent);height:56px;flex-shrink:0}
#petName{font-size:20px;font-weight:bold;color:var(--text)}
#stageLabel{font-size:13px;color:var(--white);background:var(--accent);padding:2px 10px;border-radius:10px;margin-left:8px}
.stat-group{display:flex;gap:12px;align-items:center}
.stat{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text)}
.stat-icon{font-size:18px}
.stat-bar{width:72px;height:10px;background:rgba(255,255,255,0.6);border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,0.08)}
.stat-fill{height:100%;border-radius:5px;transition:width 0.5s ease}
.stat-fill.hunger{background:var(--bar-hunger)}
.stat-fill.love{background:var(--bar-love)}
.stat-fill.health{background:var(--bar-health)}
.stat-fill.sleep{background:var(--bar-sleep)}
#clock{font-size:13px;color:var(--text-light)}

/* MAIN */
#mainArea{flex:1;display:flex;position:relative;overflow:hidden}
#room{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,var(--wall) 0%,var(--wall) 55%,var(--floor) 55%,var(--floor) 100%)}
#wallpaper{position:absolute;top:0;left:0;right:0;height:55%;background-image:radial-gradient(circle at 20% 30%,rgba(200,170,230,0.18) 3px,transparent 3px),radial-gradient(circle at 60% 50%,rgba(200,170,230,0.18) 3px,transparent 3px),radial-gradient(circle at 80% 20%,rgba(200,170,230,0.18) 3px,transparent 3px),radial-gradient(circle at 40% 70%,rgba(200,170,230,0.18) 3px,transparent 3px);background-size:80px 80px}
#floorPattern{position:absolute;bottom:0;left:0;right:0;height:45%;background:repeating-linear-gradient(90deg,transparent,transparent 79px,rgba(180,160,200,0.1) 79px,rgba(180,160,200,0.1) 80px),repeating-linear-gradient(0deg,transparent,transparent 79px,rgba(180,160,200,0.1) 79px,rgba(180,160,200,0.1) 80px)}

/* PET */
#pet{position:absolute;z-index:10;cursor:pointer}
#pet img{width:100%;height:100%;object-fit:contain}

/* BUBBLE */
#bubble{position:absolute;z-index:20;display:none;background:var(--white);border:2px solid var(--accent);border-radius:16px;padding:8px 14px;font-size:16px;color:var(--text);box-shadow:0 2px 8px var(--shadow);white-space:nowrap;animation:bubblePop .3s ease}
#bubble::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid var(--accent)}
@keyframes bubblePop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

.heart-particle{position:absolute;z-index:25;pointer-events:none;font-size:20px;animation:heartFloat 1s ease forwards}
@keyframes heartFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(.5)}}

/* FURNITURE */
.furniture{position:absolute;z-index:5;cursor:grab;touch-action:none;font-size:80px;filter:drop-shadow(0 3px 6px var(--shadow));transition:transform .1s,opacity .2s}
.furniture.dragging{z-index:50;transform:scale(1.15);opacity:.85}

/* TRASH */
#trashZone{position:absolute;bottom:12px;right:12px;z-index:45;width:72px;height:72px;border-radius:50%;background:rgba(220,100,100,0.15);border:3px dashed rgba(220,100,100,0.3);display:none;align-items:center;justify-content:center;font-size:36px;transition:transform .2s,background .2s}
#trashZone.active{background:rgba(220,100,100,0.4);border-color:rgba(220,80,80,0.7);transform:scale(1.2)}

/* BOTTOM */
#bottomBar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;background:var(--panel);border-top:2px solid var(--accent);height:72px;flex-shrink:0}
.action-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:72px;height:56px;background:var(--btn);border:none;border-radius:12px;color:var(--white);font-size:11px;font-weight:bold;cursor:pointer;box-shadow:0 2px 4px var(--shadow);transition:background .2s,transform .1s}
.action-btn:active{transform:scale(.95);background:var(--btn-hover)}
.action-btn .icon{font-size:22px}

/* SHOP */
#shopToggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:30;background:var(--btn);border:none;width:40px;height:40px;border-radius:50%;font-size:20px;color:var(--white);cursor:pointer;box-shadow:0 2px 6px var(--shadow)}
#shopPanel{position:absolute;right:0;top:0;bottom:0;width:220px;background:var(--panel);border-left:2px solid var(--accent);z-index:28;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding:12px}
#shopPanel.open{transform:translateX(0)}
#shopPanel h3{font-size:15px;color:var(--text);margin-bottom:8px;text-align:center}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow-y:auto;flex:1}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;background:var(--white);border-radius:10px;cursor:pointer;border:2px solid transparent;transition:border-color .2s}
.shop-item:active{border-color:var(--accent2)}
.shop-item .item-icon{font-size:48px}
.shop-item .item-name{font-size:11px;color:var(--text)}

/* EGG */
#eggOverlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse,rgba(237,229,244,0.95),rgba(216,204,232,0.98))}
#eggOverlay img{width:280px;height:auto;cursor:pointer;animation:eggBounce 2s ease-in-out infinite}
#eggOverlay .tap-hint{margin-top:16px;font-size:18px;color:var(--text-light);animation:pulse 2s ease-in-out infinite}
#tapCounter{font-size:14px;color:var(--accent2);margin-top:8px}
@keyframes eggBounce{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-10px) rotate(2deg)}75%{transform:translateY(-5px) rotate(-2deg)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* SLEEP */
#sleepOverlay{position:absolute;inset:0;z-index:40;background:rgba(30,20,50,0.7);display:none;align-items:center;justify-content:center;flex-direction:column}
#sleepOverlay .zzz{font-size:48px;color:rgba(200,180,240,0.8);animation:zzzFloat 2s ease-in-out infinite}
@keyframes zzzFloat{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-20px);opacity:1}}

/* SICK */
#sickIcon{position:absolute;z-index:15;font-size:28px;display:none;animation:sickPulse 1s ease-in-out infinite}
@keyframes sickPulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}

/* NOTIFICATION */
#notification{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--white);padding:8px 20px;border-radius:20px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;box-shadow:0 4px 12px var(--shadow)}
#notification.show{opacity:1}

/* ====== POPUP MENUS ====== */
.popup-overlay{position:absolute;inset:0;z-index:60;background:rgba(90,64,112,0.5);display:none;align-items:center;justify-content:center}
.popup-overlay.show{display:flex}
.popup-box{background:var(--white);border-radius:20px;padding:24px;box-shadow:0 8px 32px var(--shadow);text-align:center;min-width:320px;max-width:90%}
.popup-box h3{font-size:20px;color:var(--text);margin-bottom:16px}
.popup-choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.popup-choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 20px;background:var(--panel);border-radius:16px;border:3px solid transparent;cursor:pointer;transition:border-color .2s,transform .15s;min-width:90px}
.popup-choice:active{transform:scale(.95);border-color:var(--accent2)}
.popup-choice .choice-icon{font-size:44px}
.popup-choice .choice-name{font-size:14px;font-weight:bold;color:var(--text)}
.popup-close{margin-top:16px;padding:8px 24px;background:var(--btn);border:none;border-radius:12px;color:var(--white);font-size:14px;cursor:pointer}

/* ====== MINI GAME OVERLAY ====== */
#gameOverlay{position:absolute;inset:0;z-index:70;background:rgba(237,229,244,0.97);display:none;flex-direction:column;align-items:center;justify-content:center}
#gameOverlay.show{display:flex}
#gameContent{text-align:center;width:90%;max-width:600px}
#gameContent h2{font-size:24px;color:var(--text);margin-bottom:20px}
.game-close{position:absolute;top:12px;right:16px;font-size:28px;background:none;border:none;color:var(--text-light);cursor:pointer}

/* Math Game */
.math-problem{font-size:52px;color:var(--text);margin:20px 0;font-weight:bold}
.math-op{color:var(--accent2)}
.math-answers{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.math-ans{font-size:36px;padding:14px 32px;background:var(--panel);border:3px solid var(--accent);border-radius:16px;cursor:pointer;color:var(--text);font-weight:bold;transition:background .2s,transform .15s;min-width:80px}
.math-ans:active{transform:scale(.9)}
.math-ans.correct{background:#A8D8C0;border-color:#80C0A0}
.math-ans.wrong{background:#F0A8B8;border-color:#E08898}
.game-score{font-size:18px;color:var(--text-light);margin-top:12px}
.math-type{font-size:14px;color:var(--accent2);margin-bottom:4px}

/* Eigo Game */
.eigo-emoji{font-size:96px;margin:16px 0}
.eigo-hint{font-size:16px;color:var(--text-light);margin-bottom:16px}
.eigo-choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.eigo-btn{font-size:24px;padding:12px 28px;background:var(--panel);border:3px solid var(--accent);border-radius:16px;cursor:pointer;color:var(--text);font-weight:bold;transition:background .2s,transform .15s;letter-spacing:1px}
.eigo-btn:active{transform:scale(.9)}
.eigo-btn.correct{background:#A8D8C0;border-color:#80C0A0}
.eigo-btn.wrong{background:#F0A8B8;border-color:#E08898}
.eigo-result{font-size:28px;margin:12px 0;min-height:40px;color:var(--text)}

/* Mogura */
.mogura-field{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:360px;margin:16px auto}
.mogura-hole{width:100px;height:100px;background:var(--panel);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer;border:3px solid var(--accent);transition:background .15s}
.mogura-hole.active{background:#F0C0D8;animation:moguraPop .3s ease}
.mogura-hole.hit{background:#A8D8C0}
@keyframes moguraPop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.mogura-timer{font-size:20px;color:var(--text);margin-bottom:8px}
.mogura-score{font-size:20px;color:var(--accent2);font-weight:bold}

@media(max-height:500px){
  #topBar{height:44px;padding:4px 12px}
  #bottomBar{height:56px;padding:4px 8px}
  .action-btn{width:60px;height:46px;font-size:10px}
  .action-btn .icon{font-size:18px}
  .stat-bar{width:56px}
}
</style>
</head>
<body>

<div id="topBar">
  <div style="display:flex;align-items:center">
    <span id="petName">みお</span><span id="stageLabel">たまご</span>
  </div>
  <div class="stat-group">
    <div class="stat"><span class="stat-icon">🍽️</span><div class="stat-bar"><div class="stat-fill hunger" id="barHunger" style="width:100%"></div></div></div>
    <div class="stat"><span class="stat-icon">💕</span><div class="stat-bar"><div class="stat-fill love" id="barLove" style="width:100%"></div></div></div>
    <div class="stat"><span class="stat-icon">🌿</span><div class="stat-bar"><div class="stat-fill health" id="barHealth" style="width:100%"></div></div></div>
    <div class="stat"><span class="stat-icon">💤</span><div class="stat-bar"><div class="stat-fill sleep" id="barSleep" style="width:100%"></div></div></div>
  </div>
  <div id="clock"></div>
</div>

<div id="mainArea">
  <div id="room">
    <div id="wallpaper"></div>
    <div id="floorPattern"></div>
    <div id="pet"><img id="petImg" src="" alt="pet"></div>
    <div id="bubble"></div>
    <div id="sickIcon">🤒</div>
    <div id="trashZone">🗑️</div>
    <div id="sleepOverlay"><div class="zzz">💤 Zzz...</div></div>
    <button id="shopToggle" onclick="toggleShop()">🛒</button>
    <div id="shopPanel">
      <h3>おみせ 🎁</h3>
      <div class="shop-grid" id="shopGrid"></div>
    </div>
  </div>
  <div id="eggOverlay">
    <img id="eggImg" src="" alt="egg">
    <div class="tap-hint">たまごをタップしてね！</div>
    <div id="tapCounter"></div>
  </div>

  <!-- FOOD MENU -->
  <div class="popup-overlay" id="foodMenu">
    <div class="popup-box">
      <h3>なにたべる？🍽️</h3>
      <div class="popup-choices">
        <div class="popup-choice" onclick="feedPet('rice')">
          <span class="choice-icon">🍚</span><span class="choice-name">おこめ</span>
        </div>
        <div class="popup-choice" onclick="feedPet('bread')">
          <span class="choice-icon">🍞</span><span class="choice-name">ぱん</span>
        </div>
        <div class="popup-choice" onclick="feedPet('pasta')">
          <span class="choice-icon">🍝</span><span class="choice-name">パスタ</span>
        </div>
      </div>
      <button class="popup-close" onclick="closePopup('foodMenu')">やめる</button>
    </div>
  </div>

  <!-- PLAY MENU -->
  <div class="popup-overlay" id="playMenu">
    <div class="popup-box">
      <h3>なにしてあそぶ？🎮</h3>
      <div class="popup-choices">
        <div class="popup-choice" onclick="startGame('math')">
          <span class="choice-icon">🔢</span><span class="choice-name">たしざん・ひきざん</span>
        </div>
        <div class="popup-choice" onclick="startGame('eigo')">
          <span class="choice-icon">🔤</span><span class="choice-name">えいご</span>
        </div>
        <div class="popup-choice" onclick="startGame('mogura')">
          <span class="choice-icon">🐹</span><span class="choice-name">もぐらたたき</span>
        </div>
      </div>
      <button class="popup-close" onclick="closePopup('playMenu')">やめる</button>
    </div>
  </div>

  <!-- GAME OVERLAY -->
  <div id="gameOverlay">
    <button class="game-close" onclick="closeGame()">✕</button>
    <div id="gameContent"></div>
  </div>
</div>

<div id="bottomBar">
  <button class="action-btn" onclick="doAction('feed')"><span class="icon">🍼</span>ごはん</button>
  <button class="action-btn" onclick="doAction('pet')"><span class="icon">🤲</span>なでる</button>
  <button class="action-btn" onclick="doAction('clean')"><span class="icon">🛁</span>おふろ</button>
  <button class="action-btn" onclick="doAction('play')"><span class="icon">🎾</span>あそぶ</button>
  <button class="action-btn" onclick="doAction('sleep')" id="btnSleep"><span class="icon">🛏️</span>ねんね</button>
  <button class="action-btn" onclick="doAction('medicine')" id="btnMed"><span class="icon">💊</span>おくすり</button>
</div>
<div id="notification"></div>

const SPRITES={
  egg:SPRITE_DATA["1"],
  baby:{front:SPRITE_DATA["2"],back:SPRITE_DATA["3"],left:SPRITE_DATA["4"],right:SPRITE_DATA["5"]},
  adult:{front:SPRITE_DATA["6"],back:SPRITE_DATA["7"],left:SPRITE_DATA["8"],right:SPRITE_DATA["9"]},
  elder:{front:SPRITE_DATA["10"],back:SPRITE_DATA["11"],left:SPRITE_DATA["12"],right:SPRITE_DATA["13"]},
};

const SHOP_ITEMS=[
  {id:'ball',icon:'⚽',name:'ボール'},{id:'teddy',icon:'🧸',name:'ぬいぐるみ'},
  {id:'book',icon:'📚',name:'ほん'},{id:'flower',icon:'🌸',name:'おはな'},
  {id:'lamp',icon:'🪔',name:'ランプ'},{id:'cushion',icon:'🛋️',name:'クッション'},
  {id:'music',icon:'🎵',name:'おんがく'},{id:'star',icon:'⭐',name:'おほしさま'},
  {id:'cake',icon:'🎂',name:'ケーキ'},{id:'ribbon',icon:'🎀',name:'リボン'},
];

const FOOD_REACTIONS={
  rice:['おこめ おいしい！🍚','もぐもぐ〜 🍚'],
  bread:['ぱん だいすき！🍞','ふわふわ〜 🍞'],
  pasta:['パスタ さいこう！🍝','つるつる〜 🍝'],
};

const FURNITURE_REACTIONS=[
  'わぁ！なにこれ？✨','すごーい！🌟','うれしい！💕',
  'きにいった！😊','たのしい！🎶','わーい！🎉',
];

const SAVE_KEY='mioicchi_v7';
const TAP_TO_HATCH=20;
const STAGE_NAMES={egg:'たまご',baby:'ベビー',adult:'おとな',elder:'おとしより'};
const PET_SIZE={egg:280,baby:280,adult:300,elder:280};
const DECAY_RATE=0.15;
const STAGE_TICKS=300;

let state={stage:'egg',tapCount:0,hunger:100,love:100,health:100,sleep:100,sick:false,sleeping:false,ageTicks:0,furniture:[],petX:0.5,petY:0.6};
let walkTarget=null,walkDir='front',bobPhase=0,idleTimer=0,bubbleTimer=null,actionCooldown=false;
let reactTarget=null; // furniture reaction target

const $=id=>document.getElementById(id);
const room=$('room'),pet=$('pet'),petImg=$('petImg');
const eggOverlay=$('eggOverlay'),eggImg=$('eggImg'),trashZone=$('trashZone');

function init(){
  loadState();setupShop();setupEgg();renderFurniture();updateUI();
  if(state.stage!=='egg'){eggOverlay.style.display='none';positionPet();updateSprite();}
  requestAnimationFrame(gameLoop);
  setInterval(tick,3000);setInterval(updateClock,1000);updateClock();
  pet.addEventListener('pointerdown',e=>{
    e.preventDefault();if(state.stage==='egg')return;
    spawnHearts(e.clientX,e.clientY);state.love=Math.min(100,state.love+3);updateUI();
  },{passive:false});
}

function setupEgg(){
  eggImg.src=SPRITES.egg;
  eggImg.addEventListener('pointerdown',e=>{
    e.preventDefault();state.tapCount++;
    $('tapCounter').textContent=state.tapCount+' / '+TAP_TO_HATCH;
    eggImg.style.animation='none';void eggImg.offsetHeight;eggImg.style.animation='eggBounce 0.3s ease';
    if(state.tapCount>=TAP_TO_HATCH)hatch();
  },{passive:false});
}

function hatch(){
  state.stage='baby';state.tapCount=0;state.ageTicks=0;
  eggOverlay.style.display='none';positionPet();updateSprite();updateUI();
  notify('たまごがかえった！🐣');saveState();
}

let lastTime=0;
function gameLoop(ts){
  const dt=(ts-lastTime)/1000;lastTime=ts;
  if(state.stage!=='egg'&&!state.sleeping)updateMovement(dt);
  requestAnimationFrame(gameLoop);
}

function updateMovement(dt){
  const sz=PET_SIZE[state.stage],rw=room.clientWidth,rh=room.clientHeight;

  // Priority: react to new furniture
  if(reactTarget){
    walkTarget=reactTarget;reactTarget=null;
  }

  if(!walkTarget){
    idleTimer-=dt;
    if(idleTimer<=0){
      walkTarget={x:0.05+Math.random()*0.7,y:0.4+Math.random()*0.35};
      idleTimer=2+Math.random()*4;
    }else{walkDir='front';updateSprite();return;}
  }

  const speed=0.06,dx=walkTarget.x-state.petX,dy=walkTarget.y-state.petY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<0.02){
    // Arrived
    if(walkTarget.reaction){
      showBubble(walkTarget.reaction);
      spawnHearts(pet.getBoundingClientRect().left+pet.offsetWidth/2,pet.getBoundingClientRect().top);
    }
    walkTarget=null;walkDir='front';idleTimer=2+Math.random()*5;
    pet.style.transform='';updateSprite();return;
  }
  state.petX+=dx/dist*speed*dt;state.petY+=dy/dist*speed*dt;
  if(Math.abs(dx)>Math.abs(dy)*0.5){walkDir=dx>0?'right':'left';}
  else{walkDir=dy>0?'front':'back';}
  bobPhase+=dt*6;pet.style.transform='translateY('+(Math.sin(bobPhase)*4)+'px)';
  positionPet();updateSprite();
}

function positionPet(){
  const sz=PET_SIZE[state.stage],rw=room.clientWidth,rh=room.clientHeight;
  pet.style.left=(state.petX*(rw-sz))+'px';pet.style.top=(state.petY*(rh-sz))+'px';
  pet.style.width=sz+'px';pet.style.height=sz+'px';
}
function updateSprite(){
  if(state.stage==='egg')return;const ss=SPRITES[state.stage];if(!ss)return;
  const src=ss[walkDir]||ss.front;if(petImg.src!==src)petImg.src=src;
}

function tick(){
  if(state.stage==='egg')return;state.ageTicks++;
  if(!state.sleeping){
    state.hunger=Math.max(0,state.hunger-DECAY_RATE);
    state.love=Math.max(0,state.love-DECAY_RATE*0.5);
    state.health=Math.max(0,state.health-DECAY_RATE*0.3);
    state.sleep=Math.max(0,state.sleep-DECAY_RATE*0.6);
  }else{state.sleep=Math.min(100,state.sleep+1);if(state.sleep>=100)wakeUp();}
  if(!state.sick&&(state.hunger<15||state.health<15)){
    if(Math.random()<0.2){state.sick=true;notify('ぐあいがわるいみたい... 🤒');}
  }
  if(state.sick)state.health=Math.max(0,state.health-0.3);
  if(state.ageTicks>=STAGE_TICKS)evolve();
  updateUI();if(state.ageTicks%10===0)saveState();
}
function evolve(){
  const next={baby:'adult',adult:'elder'};
  if(next[state.stage]){
    state.stage=next[state.stage];state.ageTicks=0;positionPet();updateSprite();
    notify('おおきくなった！→ '+STAGE_NAMES[state.stage]+' 🎉');saveState();
  }
}

// === ACTIONS ===
function doAction(type){
  if(state.stage==='egg')return;
  if(actionCooldown)return;
  switch(type){
    case 'feed':
      $('foodMenu').classList.add('show');return;
    case 'pet':
      actionCooldown=true;setTimeout(()=>actionCooldown=false,800);
      state.love=Math.min(100,state.love+20);showBubble('うれしい！💕');
      spawnHearts(pet.getBoundingClientRect().left+pet.offsetWidth/2,pet.getBoundingClientRect().top);
      break;
    case 'clean':
      actionCooldown=true;setTimeout(()=>actionCooldown=false,800);
      state.health=Math.min(100,state.health+25);showBubble('ぴかぴか ✨');break;
    case 'play':
      $('playMenu').classList.add('show');return;
    case 'sleep':
      actionCooldown=true;setTimeout(()=>actionCooldown=false,800);
      if(!state.sleeping){
        state.sleeping=true;$('sleepOverlay').style.display='flex';
        walkDir='front';updateSprite();pet.style.transform='';showBubble('おやすみ... 💤');
      }else{wakeUp();}
      break;
    case 'medicine':
      actionCooldown=true;setTimeout(()=>actionCooldown=false,800);
      if(state.sick){state.sick=false;state.health=Math.min(100,state.health+20);showBubble('げんきになった！🌟');}
      else{showBubble('びょうきじゃないよ 😊');}
      break;
  }
  updateUI();saveState();
}

// === FOOD ===
function feedPet(food){
  closePopup('foodMenu');
  actionCooldown=true;setTimeout(()=>actionCooldown=false,800);
  state.hunger=Math.min(100,state.hunger+25);
  const msgs=FOOD_REACTIONS[food];
  showBubble(msgs[Math.floor(Math.random()*msgs.length)]);
  updateUI();saveState();
}

function wakeUp(){state.sleeping=false;$('sleepOverlay').style.display='none';showBubble('おはよう！☀️');}

function closePopup(id){$(id).classList.remove('show');}

// === UI ===
function updateUI(){
  $('barHunger').style.width=state.hunger+'%';$('barLove').style.width=state.love+'%';
  $('barHealth').style.width=state.health+'%';$('barSleep').style.width=state.sleep+'%';
  $('stageLabel').textContent=STAGE_NAMES[state.stage];
  const si=$('sickIcon');
  if(state.sick&&state.stage!=='egg'){
    si.style.display='block';const pr=pet.getBoundingClientRect(),rr=room.getBoundingClientRect();
    si.style.left=(pr.left-rr.left+pr.width/2-14)+'px';si.style.top=(pr.top-rr.top-30)+'px';
  }else{si.style.display='none';}
  $('btnMed').style.opacity=state.sick?1:0.5;
  $('btnSleep').querySelector('.icon').textContent=state.sleeping?'☀️':'🛏️';
  $('btnSleep').lastChild.textContent=state.sleeping?'おきる':'ねんね';
}
function updateClock(){const n=new Date();$('clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
function showBubble(text){
  const b=$('bubble');b.textContent=text;b.style.display='block';
  const pr=pet.getBoundingClientRect(),rr=room.getBoundingClientRect();
  b.style.left=(pr.left-rr.left+pr.width/2-b.offsetWidth/2)+'px';
  b.style.top=(pr.top-rr.top-44)+'px';
  clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>b.style.display='none',2000);
}
function spawnHearts(cx,cy){
  const rr=room.getBoundingClientRect();
  for(let i=0;i<4;i++){
    const h=document.createElement('div');h.className='heart-particle';h.textContent='💖';
    h.style.left=(cx-rr.left+(Math.random()-.5)*40)+'px';
    h.style.top=(cy-rr.top+(Math.random()-.5)*20)+'px';
    h.style.animationDelay=(i*.15)+'s';room.appendChild(h);setTimeout(()=>h.remove(),1200);
  }
}
function notify(msg){const n=$('notification');n.textContent=msg;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2500);}

// === SHOP ===
function setupShop(){
  const grid=$('shopGrid');
  SHOP_ITEMS.forEach(item=>{
    const el=document.createElement('div');el.className='shop-item';
    el.innerHTML='<span class="item-icon">'+item.icon+'</span><span class="item-name">'+item.name+'</span>';
    el.addEventListener('pointerdown',e=>{e.preventDefault();placeFurniture(item);},{passive:false});
    grid.appendChild(el);
  });
}
function toggleShop(){$('shopPanel').classList.toggle('open');}
function placeFurniture(item){
  const fx=0.3+Math.random()*0.4, fy=0.55+Math.random()*0.3;
  const f={id:item.id+'_'+Date.now(),icon:item.icon,x:fx,y:fy};
  state.furniture.push(f);renderOneFurniture(f);toggleShop();
  notify(item.name+'をおいたよ！');

  // Pet reacts: walk toward the new item
  const reaction=FURNITURE_REACTIONS[Math.floor(Math.random()*FURNITURE_REACTIONS.length)];
  reactTarget={x:Math.max(0.05,Math.min(0.75,fx-0.05)),y:Math.max(0.4,Math.min(0.8,fy)),reaction:reaction};

  saveState();
}
function renderFurniture(){room.querySelectorAll('.furniture').forEach(e=>e.remove());state.furniture.forEach(f=>renderOneFurniture(f));}
function renderOneFurniture(f){
  const el=document.createElement('div');el.className='furniture';el.textContent=f.icon;el.dataset.fid=f.id;
  const rw=room.clientWidth,rh=room.clientHeight;
  el.style.left=(f.x*(rw-80))+'px';el.style.top=(f.y*(rh-80))+'px';
  let dragging=false,offX=0,offY=0;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();dragging=true;el.classList.add('dragging');
    const er=el.getBoundingClientRect();offX=e.clientX-er.left;offY=e.clientY-er.top;
    el.setPointerCapture(e.pointerId);trashZone.style.display='flex';
  },{passive:false});
  el.addEventListener('pointermove',e=>{
    if(!dragging)return;const rr=room.getBoundingClientRect();
    let nx=e.clientX-rr.left-offX,ny=e.clientY-rr.top-offY;
    nx=Math.max(0,Math.min(rr.width-80,nx));ny=Math.max(rr.height*0.4,Math.min(rr.height-80,ny));
    el.style.left=nx+'px';el.style.top=ny+'px';
    f.x=nx/(rr.width-80);f.y=ny/(rr.height-80);
    const tr=trashZone.getBoundingClientRect(),cx=e.clientX,cy=e.clientY;
    trashZone.classList.toggle('active',cx>=tr.left&&cx<=tr.right&&cy>=tr.top&&cy<=tr.bottom);
  });
  el.addEventListener('pointerup',e=>{
    if(!dragging)return;dragging=false;el.classList.remove('dragging');
    const tr=trashZone.getBoundingClientRect(),cx=e.clientX,cy=e.clientY;
    if(cx>=tr.left&&cx<=tr.right&&cy>=tr.top&&cy<=tr.bottom){
      state.furniture=state.furniture.filter(x=>x.id!==f.id);el.remove();notify('かたづけたよ！🗑️');
    }
    trashZone.style.display='none';trashZone.classList.remove('active');saveState();
  });
  el.addEventListener('pointercancel',()=>{dragging=false;el.classList.remove('dragging');trashZone.style.display='none';trashZone.classList.remove('active');});
  room.appendChild(el);
}

// MINI GAMES
// ========================
let gameCleanup=null;

function startGame(type){
  closePopup('playMenu');
  const ov=$('gameOverlay'),gc=$('gameContent');
  ov.classList.add('show');gc.innerHTML='';
  if(type==='math')initMath(gc);
  else if(type==='eigo')initEigo(gc);
  else if(type==='mogura')initMogura(gc);
}
function closeGame(){
  $('gameOverlay').classList.remove('show');
  if(gameCleanup){gameCleanup();gameCleanup=null;}
}

// --- JANKEN ---
// --- MATH (たしざん・ひきざん) ---
function initMath(gc){
  let score=0,total=0;
  function newProblem(){
    const isAdd=Math.random()<0.5;
    let a,b,correct,symbol;
    if(isAdd){
      a=Math.floor(Math.random()*9)+1;
      b=Math.floor(Math.random()*9)+1;
      correct=a+b;
      symbol='＋';
    }else{
      // ensure a>=b so no negative answers
      a=Math.floor(Math.random()*9)+2;
      b=Math.floor(Math.random()*a)+1;
      correct=a-b;
      symbol='ー';
    }
    let wrongs=new Set();
    while(wrongs.size<2){
      let w=correct+Math.floor(Math.random()*5)-2;
      if(w!==correct&&w>=0&&w<=20)wrongs.add(w);
    }
    let answers=[correct,...wrongs];
    for(let i=answers.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [answers[i],answers[j]]=[answers[j],answers[i]];
    }
    gc.innerHTML=`
      <h2>たしざん・ひきざん 🔢</h2>
      <div class="math-type">${isAdd?'たしざん ＋':'ひきざん ー'}</div>
      <div class="math-problem">${a} <span class="math-op">${symbol}</span> ${b} ＝ ？</div>
      <div class="math-answers">
        ${answers.map(a=>`<button class="math-ans" data-v="${a}">${a}</button>`).join('')}
      </div>
      <div class="game-score" id="mScore">${score}もん せいかい / ${total}もん</div>
    `;
    gc.querySelectorAll('.math-ans').forEach(btn=>{
      btn.addEventListener('pointerdown',e=>{
        e.preventDefault();
        const v=parseInt(btn.dataset.v);
        total++;
        if(v===correct){
          btn.classList.add('correct');score++;
          state.love=Math.min(100,state.love+3);
          setTimeout(newProblem,800);
        }else{
          btn.classList.add('wrong');
          gc.querySelector(`[data-v="${correct}"]`).classList.add('correct');
          setTimeout(newProblem,1200);
        }
        $('mScore').textContent=score+'もん せいかい / '+total+'もん';
        updateUI();
      },{passive:false});
    });
  }
  newProblem();
}

// --- EIGO ---
function initEigo(gc){
  const words=[
    {emoji:'🍎',en:'Apple',ja:'りんご'},
    {emoji:'🐱',en:'Cat',ja:'ねこ'},
    {emoji:'🐶',en:'Dog',ja:'いぬ'},
    {emoji:'🌸',en:'Flower',ja:'はな'},
    {emoji:'☀️',en:'Sun',ja:'たいよう'},
    {emoji:'🌙',en:'Moon',ja:'つき'},
    {emoji:'⭐',en:'Star',ja:'ほし'},
    {emoji:'🐟',en:'Fish',ja:'さかな'},
    {emoji:'🐦',en:'Bird',ja:'とり'},
    {emoji:'🌳',en:'Tree',ja:'き'},
    {emoji:'📚',en:'Book',ja:'ほん'},
    {emoji:'🍞',en:'Bread',ja:'ぱん'},
    {emoji:'🥚',en:'Egg',ja:'たまご'},
    {emoji:'💧',en:'Water',ja:'みず'},
    {emoji:'🔥',en:'Fire',ja:'ひ'},
    {emoji:'🐸',en:'Frog',ja:'かえる'},
    {emoji:'🐰',en:'Rabbit',ja:'うさぎ'},
    {emoji:'🎵',en:'Music',ja:'おんがく'},
    {emoji:'☁️',en:'Cloud',ja:'くも'},
    {emoji:'🌈',en:'Rainbow',ja:'にじ'},
    {emoji:'🍇',en:'Grape',ja:'ぶどう'},
    {emoji:'🍌',en:'Banana',ja:'バナナ'},
    {emoji:'🐻',en:'Bear',ja:'くま'},
    {emoji:'🏠',en:'House',ja:'いえ'},
  ];
  let score=0,total=0,usedIdx=new Set();

  function pickUnused(){
    if(usedIdx.size>=words.length)usedIdx.clear();
    let idx;
    do{idx=Math.floor(Math.random()*words.length);}while(usedIdx.has(idx));
    usedIdx.add(idx);
    return idx;
  }

  function newProblem(){
    const ci=pickUnused();
    const correct=words[ci];
    // Pick 2 wrong answers
    let wrongSet=new Set([ci]);
    while(wrongSet.size<3){
      const wi=Math.floor(Math.random()*words.length);
      wrongSet.add(wi);
    }
    let choices=[...wrongSet].map(i=>words[i]);
    // Shuffle
    for(let i=choices.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [choices[i],choices[j]]=[choices[j],choices[i]];
    }

    gc.innerHTML=`
      <h2>えいご 🔤</h2>
      <div class="eigo-emoji">${correct.emoji}</div>
      <div class="eigo-hint">これはえいごでなんていう？（${correct.ja}）</div>
      <div class="eigo-result" id="eResult"></div>
      <div class="eigo-choices">
        ${choices.map(c=>`<button class="eigo-btn" data-en="${c.en}">${c.en}</button>`).join('')}
      </div>
      <div class="game-score" id="eScore">${score}もん せいかい / ${total}もん</div>
    `;
    gc.querySelectorAll('.eigo-btn').forEach(btn=>{
      btn.addEventListener('pointerdown',e=>{
        e.preventDefault();
        const picked=btn.dataset.en;
        total++;
        if(picked===correct.en){
          btn.classList.add('correct');score++;
          $('eResult').textContent='せいかい！🎉 '+correct.en+'（'+correct.ja+'）';
          state.love=Math.min(100,state.love+3);
          setTimeout(newProblem,1200);
        }else{
          btn.classList.add('wrong');
          gc.querySelector(`[data-en="${correct.en}"]`).classList.add('correct');
          $('eResult').textContent='ざんねん！こたえは '+correct.en+'（'+correct.ja+'）';
          setTimeout(newProblem,1800);
        }
        $('eScore').textContent=score+'もん せいかい / '+total+'もん';
        updateUI();
      },{passive:false});
    });
  }
  newProblem();
}

// --- MOGURA TATAKI ---
function initMogura(gc){
  let score=0,timeLeft=20,moleTimer=null,countdownTimer=null;
  gc.innerHTML=`
    <h2>もぐらたたき 🐹</h2>
    <div class="mogura-timer" id="mTimer">のこり ${timeLeft}びょう</div>
    <div class="mogura-score" id="mScore">0てん</div>
    <div class="mogura-field" id="mField">
      ${Array.from({length:9},(_,i)=>`<div class="mogura-hole" data-i="${i}"></div>`).join('')}
    </div>
  `;
  const holes=gc.querySelectorAll('.mogura-hole');
  let activeHole=-1;

  function popMole(){
    if(activeHole>=0)holes[activeHole].textContent='';
    holes.forEach(h=>{h.classList.remove('active','hit');h.textContent='';});
    activeHole=Math.floor(Math.random()*9);
    holes[activeHole].textContent='🐹';
    holes[activeHole].classList.add('active');
  }

  holes.forEach(h=>{
    h.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const i=parseInt(h.dataset.i);
      if(i===activeHole){
        score++;h.classList.add('hit');h.textContent='💥';
        $('mScore').textContent=score+'てん';
        state.love=Math.min(100,state.love+2);updateUI();
        setTimeout(popMole,400);
      }
    },{passive:false});
  });

  popMole();
  moleTimer=setInterval(()=>{if(timeLeft>0)popMole();},1200);
  countdownTimer=setInterval(()=>{
    timeLeft--;$('mTimer').textContent='のこり '+timeLeft+'びょう';
    if(timeLeft<=0){
      clearInterval(moleTimer);clearInterval(countdownTimer);
      holes.forEach(h=>{h.textContent='';h.classList.remove('active');});
      gc.innerHTML=`
        <h2>おわり！🎉</h2>
        <div style="font-size:48px;margin:20px">${score}てん</div>
        <div style="font-size:18px;color:var(--text-light);margin-bottom:20px">
          ${score>=10?'すごい！🌟':score>=5?'がんばったね！😊':'つぎはもっとがんばろう！💪'}
        </div>
        <button class="popup-close" onclick="closeGame()">おわる</button>
      `;
    }
  },1000);

  gameCleanup=()=>{clearInterval(moleTimer);clearInterval(countdownTimer);};
}

function loadState(){try{const s=localStorage.getItem(SAVE_KEY);if(s)Object.assign(state,JSON.parse(s));}catch(e){}}

window.addEventListener('resize',()=>{if(state.stage!=='egg')positionPet();renderFurniture();});
init();
